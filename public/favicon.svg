<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2B4C"/>
      <stop offset="100%" style="stop-color:#0F1B33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="50%" style="stop-color:#C5A55A"/>
      <stop offset="100%" style="stop-color:#B8943F"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Ikat-inspired diamond border pattern -->
  <path d="M256 40 L472 256 L256 472 L40 256 Z" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.25"/>
  <path d="M256 70 L442 256 L256 442 L70 256 Z" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.15"/>
  <!-- Elegant "A" lettermark -->
  <text x="256" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="280" font-weight="700" fill="url(#gold)" text-anchor="middle" dominant-baseline="central">A</text>
  <!-- Small decorative dots (Ikat-inspired) -->
  <circle cx="256" cy="420" r="6" fill="url(#gold)" opacity="0.6"/>
  <circle cx="236" cy="430" r="3" fill="url(#gold)" opacity="0.4"/>
  <circle cx="276" cy="430" r="3" fill="url(#gold)" opacity="0.4"/>
</svg>
