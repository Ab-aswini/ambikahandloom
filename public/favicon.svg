<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle in deep indigo -->
  <circle cx="32" cy="32" r="32" fill="#1A2B4C"/>
  <!-- Decorative ikat-style border lines -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FCFCFA" stroke-width="1" stroke-dasharray="3 2" opacity="0.3"/>
  <!-- "A" letterform in cream -->
  <text x="32" y="44" font-family="Georgia, serif" font-size="32" font-weight="700" text-anchor="middle" fill="#FCFCFA" letter-spacing="-1">A</text>
  <!-- Decorative dot accent (ikat motif) -->
  <circle cx="32" cy="52" r="2" fill="#8B263E" opacity="0.8"/>
</svg>
